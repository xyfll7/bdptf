name: Deploy blog to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'layouts/**'
      - 'static/**'
      - 'themes/**'
      - 'hugo.yaml'
      - 'scripts/**'
      - 'articles/**'
      - 'images/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # PaperMod 要求 >= 0.158.0。
          hugo-version: '0.169.0'

      - uses: actions/configure-pages@v5
        id: pages

      - name: Check sticker modules
        run: |
          for f in static/sticker/lib/app.js static/sticker/lib/studio.js \
                   static/sticker/lib/design.js static/sticker/lib/render.js; do
            test -f "$f" || { echo "缺少 $f"; exit 1; }
            node --check "$f"
          done

      - name: Build site
        run: |
          hugo --minify --gc \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --destination ./public

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4