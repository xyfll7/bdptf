name: Deploy stickers site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify site assets exist
        run: |
          test -f docs/index.html
          test -f docs/style.css
          test -f docs/lib/app.js
          test -f docs/lib/render.js
          test -f docs/lib/studio.js
          test -f docs/lib/design.js

      - name: Syntax check site modules
        run: |
          node --check docs/lib/app.js
          node --check docs/lib/render.js
          node --check docs/lib/design.js
          node --check docs/lib/studio.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4